
# the reason for test is to make sure that whatever data is going to the data warehouse is tested to make sure whatever data the business is consuming is a good data, and 
# if there is an issue with the data, we can inform the business that hi there is an issue with the datat and that we are working on that. 

#once you execute dbt build --employee, dbt will first execute the model "employee" and the any test cases within that folder where the employee is located. 
# the generic test cases that dbt provid are: unique, nit_null, accepted_values, and relationships. If we need to create other tests that are not apart of the dbt generic 
# test, we need to create a custom test for that. 
#make sure to commit the change so that the changes are syned to your future branch so you can't lose them. 
version: 2  # always specify the version


# dbt test will execute all the test cases within the model folder.
# dbt test --select specific model. example dbt test --select employee


models:
  - name: employee
    description: "Employee DBT model"
    columns:
      - name: emp_id
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['1','2','3','4','5']
                config:
                  severity: warn
      - name: emp_salary
        data_tests:
          - salary_check
  - name: customer
    description: "DBT Model for the customer table"  
  - name: customer_vw
    description: "DBT Model for the customer view"
  - name: sales
    description: "DBT model for the sales table"    
sources:
  - name: employee
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: EMPLOYEE_RAW
  - name: customer
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: CUSTOMER_SRC
  - name: sales
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: SALES_SRC








